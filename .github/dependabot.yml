version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Minor/patch updates in one PR; majors stay separate for manual review.
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
